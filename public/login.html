<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Nhập - YouTube Multi-Publisher</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .auth-page-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .auth-card {
      width: 100%;
      max-width: 400px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 32px 28px;
    }

    .auth-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .auth-brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .auth-brand-badge {
      width: 34px;
      height: 34px;
      background: var(--accent-red);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.1rem;
      color: #fff;
    }

    .back-home {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: var(--text-muted);
      font-size: 0.82rem;
      text-decoration: none;
      transition: var(--transition);
    }

    .back-home:hover {
      color: var(--text-primary);
    }
  </style>
</head>
<body>

  <div class="auth-page-wrapper">
    <div class="auth-card">
      
      <div class="auth-header">
        <div class="auth-brand">
          <div class="auth-brand-badge">Y</div>
          <div style="text-align:left;">
            <h2 style="font-size:1.15rem; font-weight:600; color:#fff;">YouTube Multi-Publisher</h2>
            <span style="font-size:0.72rem; color:var(--text-muted); text-transform:uppercase;">Quản Trị & Đăng Nhập</span>
          </div>
        </div>
        <p style="font-size:0.82rem; color:var(--text-muted); margin-top:4px;">Nhập thông tin tài khoản được cấp để tiếp tục</p>
      </div>

      <form id="auth-page-form">
        <div class="form-group">
          <label class="form-label" for="page-email">Địa chỉ Email *</label>
          <input type="email" id="page-email" class="form-input" placeholder="name@example.com" required autofocus>
        </div>

        <div class="form-group">
          <label class="form-label" for="page-password">Mật khẩu *</label>
          <input type="password" id="page-password" class="form-input" placeholder="Nhập mật khẩu" required minlength="6">
        </div>

        <button type="submit" class="btn btn-primary" id="btn-page-submit" style="width:100%; padding:11px; font-size:0.92rem; font-weight:600; margin-top:8px;">
          Đăng Nhập
        </button>
      </form>

      <a href="/" class="back-home">← Quay lại trang chủ</a>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const token = localStorage.getItem('ytb_auth_token');
      if (token) {
        try {
          const res = await fetch('/api/auth/me', { headers: { 'Authorization': 'Bearer ' + token } });
          const data = await res.json();
          if (data.success) {
            window.location.href = '/';
            return;
          }
        } catch (e) {}
      }

      document.getElementById('auth-page-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('page-email').value.trim();
        const password = document.getElementById('page-password').value;

        const submitBtn = document.getElementById('btn-page-submit');
        submitBtn.disabled = true;
        submitBtn.textContent = 'Đang xử lý...';

        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
          });
          const data = await res.json();
          if (data.success && data.token) {
            localStorage.setItem('ytb_auth_token', data.token);
            if (data.user) {
              localStorage.setItem('ytb_user_data', JSON.stringify(data.user));
            }
            showToast('Đăng nhập thành công!', 'success');
            setTimeout(() => { window.location.href = '/'; }, 600);
          } else {
            showToast(data.message || 'Email hoặc mật khẩu không chính xác', 'error');
          }
        } catch (err) {
          showToast('Lỗi kết nối máy chủ: ' + err.message, 'error');
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Đăng Nhập';
        }
      });
    });

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'all 0.25s ease';
        setTimeout(() => toast.remove(), 250);
      }, 3000);
    }
  </script>
</body>
</html>
